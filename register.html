<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Candal&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Cadastro - ArquiBlog</title>
</head>

<body>
    <header>
        <div class="logo">
            <h1 class="logo-text">
                <a href="index.html"><span>Arqui</span>Blog</a>
            </h1>
        </div>

        <i class="fa fa-bars menu-toggle"></i>

        <ul class="nav">
            <li><a href="index.html">Início</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="register.html">Cadastrar</a></li>
            <li><a href="login.html">Entrar</a></li>
        </ul>
    </header>

    <div class="auth-content">

        <form action="register.html" method="post">
            <h2 class="form-title">Cadastrar</h2>

            <div>
                <label>Nome de Usuário</label>
                <input type="text" name="username" class="text-input">
            </div>

            <div>
                <label>E-mail</label>
                <input type="email" name="email" class="text-input">
            </div>

            <div>
                <label>Senha</label>
                <input type="password" name="password" class="text-input">
            </div>

            <div>
                <label>Confirmar Senha</label>
                <input type="password" name="passwordConf" class="text-input">
            </div>

            <div>
                <button type="submit" name="register-btn" class="btn btn-big">Cadastrar</button>
            </div>

            <p>Já possui uma conta? <a href="login.html">Entrar</a></p>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
